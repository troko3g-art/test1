// ---------- Barallado de opcións ----------
// Elimina o sesgo de posición: as opcións ("opcional" e "multipla") barállanse
// en cada carga da páxina e os índices correctos (p.c) remapeanse en consecuencia.
// As preguntas "vf" manteñen a orde natural Verdadeiro/Falso.
function barallarOpcions() {
  preguntas.forEach(p => {
    if (p.tipo === "vf") return;
    const idxs = p.o.map((_, i) => i);
    for (let i = idxs.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    p.c = p.c.map(v => idxs.indexOf(v));
    p.o = idxs.map(i => p.o[i]);
  });
}

// ---------- Construción do test ----------
const contido = document.getElementById("contido");
const letras = ["a", "b", "c", "d"];
let corrixidas = 0;

function crearPregunta(p, idx) {
  const div = document.createElement("div");
  div.className = "pregunta";
  div.id = "p" + idx;

  const tipoTxt = p.tipo === "vf" ? "Verdadeiro/Falso" :
                  p.tipo === "multipla" ? "Resposta múltiple (marcanse todas as correctas)" : "Escolle unha opción";

  let html = "<div class='enunciado'><span class='num'>" + (idx + 1) + "</span>" + escapeHtml(p.q) +
             "<span class='etiqueta-tipo'>" + tipoTxt + "</span></div><div class='opcions'>";
  const inputTipo = p.tipo === "multipla" ? "checkbox" : "radio";
  p.o.forEach((op, i) => {
    html += "<label id='op-" + idx + "-" + i + "'><input type='" + inputTipo + "' name='p" + idx + "' value='" + i + "' onchange='marcarRespondida()'>" +
            "<span>" + letras[i] + ". " + escapeHtml(op) + "</span><span class='marca' id='marca-" + idx + "-" + i + "'></span></label>";
  });
  html += "</div><div class='accions-pregunta'><button onclick='corrixirUnha(" + idx + ")'>Corrixir</button></div>" +
          "<div class='resultados-pregunta' id='res-" + idx + "'></div>" +
          "<div class='explicacion' id='exp-" + idx + "'>💡 " + escapeHtml(p.ex) + "</div>";
  div.innerHTML = html;
  return div;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function construit() {
  let udActual = 0;
  preguntas.forEach((p, idx) => {
    if (p.ud !== udActual) {
      udActual = p.ud;
      const sep = document.createElement("div");
      sep.className = "separador-ud";
      sep.textContent = udActual === 1
        ? "UD1 · A transformación dixital (tecnoloxías habilitadoras, nube e computación distribuída)"
        : "UD2 · Intelixencia Artificial e Big Data (datos, 5 V, ciclo de vida, IA e regulación)";
      contido.appendChild(sep);
    }
    contido.appendChild(crearPregunta(p, idx));
  });
  actualizarMarcador();
}

function seleccionadas(idx) {
  return Array.from(document.querySelectorAll("input[name='p" + idx + "']:checked")).map(i => parseInt(i.value));
}

function corrixirUnha(idx) {
  const p = preguntas[idx];
  const sel = seleccionadas(idx);
  const res = document.getElementById("res-" + idx);
  const exp = document.getElementById("exp-" + idx);

  if (sel.length === 0) {
    res.className = "resultados-pregunta mal";
    res.textContent = "⚠ Non marcaste ningunha resposta.";
    return false;
  }

  const correctas = p.c.slice().sort();
  const selOrd = sel.slice().sort();
  const acerto = correctas.length === selOrd.length && correctas.every((v, i) => v === selOrd[i]);

  // Marca visual de cada opción
  p.o.forEach((_, i) => {
    const label = document.getElementById("op-" + idx + "-" + i);
    const marca = document.getElementById("marca-" + idx + "-" + i);
    label.classList.remove("correcta", "incorrecta");
    marca.textContent = "";
    marca.className = "marca";
    if (p.c.includes(i)) {
      label.classList.add("correcta");
      marca.textContent = "✔";
      marca.classList.add("ok");
    }
    if (sel.includes(i) && !p.c.includes(i)) {
      label.classList.add("incorrecta");
      marca.textContent = "✘";
      marca.classList.add("mal");
    }
  });

  if (!document.getElementById("p" + idx).classList.contains("corrixida")) {
    corrixidas++;
    document.getElementById("p" + idx).classList.add("corrixida");
  }

  if (acerto) {
    res.className = "resultados-pregunta bien";
    res.textContent = "✔ Correcto";
  } else {
    res.className = "resultados-pregunta mal";
    const esperadas = p.c.map(i => letras[i]).join(", ");
    res.textContent = "✘ Incorrecto. Resposta(s) correcta(s): " + esperadas;
  }
  exp.style.display = "block";
  actualizarMarcador();
  return acerto;
}

function corrixirTodo() {
  let acertos = 0;
  preguntas.forEach((_, idx) => { if (corrixirUnha(idx)) acertos++; });
  const resumo = document.getElementById("resumo");
  resumo.style.display = "block";
  document.getElementById("notaFinal").textContent = acertos + " / " + TOTAL;
  document.getElementById("detalleFinal").textContent =
    acertos >= 90 ? "Excelente! Dominas a materia." :
    acertos >= 70 ? "Moi ben! Repasa as preguntas falladas antes do exame." :
    acertos >= 50 ? "Aprobado por pouco. Convén repasar o material das UD1 e UD2." :
    "Necesitas repasar o material das unidades. Lee de novo os PDF e volve intentalo.";
  resumo.scrollIntoView({ behavior: "smooth" });
}

function reiniciar() {
  document.querySelectorAll("input[type='radio'], input[type='checkbox']").forEach(i => i.checked = false);
  document.querySelectorAll(".pregunta").forEach(d => { d.classList.remove("corrixida"); });
  document.querySelectorAll(".opcions label").forEach(l => l.classList.remove("correcta", "incorrecta"));
  document.querySelectorAll(".marca").forEach(m => { m.textContent = ""; m.className = "marca"; });
  document.querySelectorAll(".resultados-pregunta").forEach(r => { r.textContent = ""; r.className = "resultados-pregunta"; });
  document.querySelectorAll(".explicacion").forEach(e => e.style.display = "none");
  corrixidas = 0;
  document.getElementById("resumo").style.display = "none";
  actualizarMarcador();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function marcarRespondida() { actualizarMarcador(); }

function actualizarMarcador() {
  const respondidas = new Set();
  document.querySelectorAll("input[type='radio']:checked, input[type='checkbox']:checked").forEach(i => {
    respondidas.add(i.name);
  });
  document.getElementById("marcador").textContent = "Correctas: " + contarAcertos() + " / " + TOTAL + " · Respondidas: " + respondidas.size + " / " + TOTAL;
  document.getElementById("barra").style.width = (respondidas.size / TOTAL * 100) + "%";
}

function contarAcertos() {
  let n = 0;
  preguntas.forEach((p, idx) => {
    const sel = seleccionadas(idx).sort();
    const c = p.c.slice().sort();
    if (sel.length === c.length && c.every((v, i) => v === sel[i])) n++;
  });
  return n;
}

barallarOpcions();
construit();
